[package]
name = "sequence-editor"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Rust-powered WebAssembly MSA engine for viral genome alignment editing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.125"
js-sys = "0.3.77"
serde-wasm-bindgen = "0.6"
fm-index = "0.3.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
serde_json = "1.0"
