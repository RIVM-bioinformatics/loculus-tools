[package]
name = "sequence-editor"
version = "0.1.0"
edition = "2021"
description = "Rust-powered WebAssembly MSA engine for viral genome alignment editing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.125"
js-sys = "0.3.77"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
